name: featurama
description: Flutter SDK and feedback screen for Featurama. Collect feature requests, manage votes and comments, and follow your product roadmap.
version: 1.0.0
repository: https://github.com/vibelabsdotto/featurama-flutter
issue_tracker: https://github.com/vibelabsdotto/featurama-flutter/issues

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

topics:
  - sdk
  - api-client
  - feature-requests
  - user-feedback

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  dio_compatibility_layer: ^0.1.1
  flutter:
    sdk: flutter
  http: ^1.3.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
  mockito: ^5.4.4
  test: ^1.25.0
